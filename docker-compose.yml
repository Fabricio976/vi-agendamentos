# O serviço web exige o repositório do front ao lado deste, em ../vi-agendamentos-web.
name: vi-agendamentos

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5080:8080"
    volumes:
      - .:/src
      - api-bin:/src/ViAgendamentos.Api/bin
      - api-obj:/src/ViAgendamentos.Api/obj
      - nuget:/root/.nuget/packages

  web:
    build:
      context: ../vi-agendamentos-web
      dockerfile: Dockerfile.dev
    ports:
      - "4200:4200"
    volumes:
      - ../vi-agendamentos-web:/app
      - web-node-modules:/app/node_modules
    depends_on:
      - api

# Nomeados, e não anônimos, porque o `down` deixaria um volume anônimo órfão a cada ciclo, com uns 300 MB só de node_modules.
volumes:
  nuget:
  api-bin:
  api-obj:
  web-node-modules:
