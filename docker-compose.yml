# O serviço web exige o repositório do front ao lado deste, em ../vi-agendamentos-web.
name: vi-agendamentos

services:
  db:
    image: postgres:17
    # O :? faz o compose parar sem o .env; sem ele, subiria um banco com credencial vazia.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?crie o .env a partir do .env.example}
      POSTGRES_USER: ${POSTGRES_USER:?crie o .env a partir do .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?crie o .env a partir do .env.example}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:5080:8080"
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:?crie o cliente OAuth do Google e preencha o .env}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:?crie o cliente OAuth do Google e preencha o .env}
      GoogleAgenda__ChaveDoToken: ${GOOGLE_AGENDA_CHAVE:?gere a chave do token do Google Agenda e preencha o .env}
    volumes:
      - .:/src
      - api-bin:/src/ViAgendamentos.Api/bin
      - api-obj:/src/ViAgendamentos.Api/obj
      - nuget:/root/.nuget/packages
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../vi-agendamentos-web
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:4200:4200"
    volumes:
      - ../vi-agendamentos-web:/app
      - web-node-modules:/app/node_modules
    depends_on:
      - api

# Nomeados, e não anônimos, porque o `down` deixaria um volume anônimo órfão a cada ciclo, com uns 300 MB só de node_modules.
volumes:
  nuget:
  api-bin:
  api-obj:
  web-node-modules:
  db-data:
